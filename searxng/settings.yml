# Read the documentation before extending the defaults:
# https://docs.searxng.org/admin/settings/

use_default_settings: true

server:
  secret_key: "rcogmjz1GJFuQCTnpqzepLjGDoP7MnGy"
  image_proxy: true
  # Only ever called server-to-server from the Kavach backend on the private
  # compose network — not public-facing, so the bot/rate limiter (meant for
  # a publicly exposed instance) would just get in the way here.
  limiter: false

search:
  # json is off by default; the backend consumes results programmatically
  # (see backend/src/services/liveSearch/search.service.ts).
  formats:
    - html
    - json
