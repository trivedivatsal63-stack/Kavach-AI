# LiteLLM proxy — keys/budgets/spend in host Postgres "litellm" DB.
# When running via docker compose, VLLM_API_BASE=http://vllm:8000/v1
# (compose network). Backend on the host still talks to LiteLLM at
# http://localhost:4000.

model_list:
  # Public name clients send. Must match VLLM_SERVED_NAME / backend CHAT_MODEL.
  - model_name: qwen2.5-1.5b
    litellm_params:
      model: openai/qwen2.5-1.5b
      api_base: os.environ/VLLM_API_BASE
      api_key: not-needed
      # Placeholder rates so budget/spend work for self-hosted models.
      input_cost_per_token: 0.0001
      output_cost_per_token: 0.0002
  # Alias for keys/UI still using the previous 7b name. Same weights as above —
  # this machine's vLLM is serving the 1.5B profile, not 7B.
  - model_name: qwen2.5-7b
    litellm_params:
      model: openai/qwen2.5-1.5b
      api_base: os.environ/VLLM_API_BASE
      api_key: not-needed
      input_cost_per_token: 0.0001
      output_cost_per_token: 0.0002

litellm_settings:
  drop_params: true
  default_key_generate_params:
    rpm_limit: 20
    max_budget: 5.0
    budget_duration: "30d"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
