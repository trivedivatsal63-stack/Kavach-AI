# LiteLLM proxy — keys/budgets/spend in host Postgres "litellm" DB.
# When running via docker compose, VLLM_API_BASE=http://vllm:8000/v1
# (compose network). Backend on the host still talks to LiteLLM at
# http://localhost:4000.

model_list:
  # Public names clients send. Must match VLLM_SERVED_NAME / backend CHAT_MODEL.
  # Dev laptop: vLLM serves qwen2.5-7b (see root .env VLLM_SERVED_NAME).
  # Keep 1.5b as alias so old keys/frontend still work — both point to same vLLM.
  - model_name: qwen2.5-7b
    litellm_params:
      model: openai/qwen2.5-7b
      api_base: os.environ/VLLM_API_BASE
      api_key: not-needed
      input_cost_per_token: 0.0001
      output_cost_per_token: 0.0002
  - model_name: qwen2.5-1.5b
    litellm_params:
      model: openai/qwen2.5-7b
      api_base: os.environ/VLLM_API_BASE
      api_key: not-needed
      input_cost_per_token: 0.0001
      output_cost_per_token: 0.0002
  # Production RunPod profile - Qwen3-30B-A3B served by native vLLM on the pod.
  - model_name: qwen3-30b-a3b
    litellm_params:
      model: openai/qwen3-30b-a3b
      api_base: os.environ/VLLM_API_BASE
      api_key: not-needed
      input_cost_per_token: 0.0001
      output_cost_per_token: 0.0002

litellm_settings:
  drop_params: true
  default_key_generate_params:
    rpm_limit: 20
    max_budget: 5.0
    budget_duration: "30d"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
