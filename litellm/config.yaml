# LiteLLM proxy — keys/budgets/spend in host Postgres "litellm" DB.
# When running via docker compose, VLLM_API_BASE=http://vllm:8000/v1
# (compose network). Backend on the host still talks to LiteLLM at
# http://localhost:4000.

model_list:
  # Primary: Mistral Small 24B Instruct 2501 AWQ-INT4 (France, Apache-2.0,
  # no gating). Must match VLLM_SERVED_NAME / backend CHAT_MODEL.
  - model_name: mistral-small-24b-awq
    litellm_params:
      model: openai/mistral-small-24b-awq
      api_base: os.environ/VLLM_API_BASE
      api_key: not-needed
      input_cost_per_token: 0.0001
      output_cost_per_token: 0.0002
  # Alias so old UIs/tests that send the base name still resolve (same vLLM).
  - model_name: mistral-small-24b
    litellm_params:
      model: openai/mistral-small-24b-awq
      api_base: os.environ/VLLM_API_BASE
      api_key: not-needed
      input_cost_per_token: 0.0001
      output_cost_per_token: 0.0002
  # Rollback aliases — Qwen (local dev + revert path). Commented for production migration.
  # Uncomment the block below to revert VLLM_MODEL to Qwen without editing code.
  # - model_name: qwen2.5-7b
  #   litellm_params:
  #     model: openai/qwen2.5-7b
  #     api_base: os.environ/VLLM_API_BASE
  #     api_key: not-needed
  #     input_cost_per_token: 0.0001
  #     output_cost_per_token: 0.0002
  # - model_name: qwen2.5-1.5b
  #   litellm_params:
  #     model: openai/qwen2.5-7b
  #     api_base: os.environ/VLLM_API_BASE
  #     api_key: not-needed
  #     input_cost_per_token: 0.0001
  #     output_cost_per_token: 0.0002
  # - model_name: qwen3-30b-a3b
  #   litellm_params:
  #     model: openai/qwen3-30b-a3b
  #     api_base: os.environ/VLLM_API_BASE
  #     api_key: not-needed
  #     input_cost_per_token: 0.0001
  #     output_cost_per_token: 0.0002

litellm_settings:
  drop_params: true
  default_key_generate_params:
    rpm_limit: 20
    max_budget: 5.0
    budget_duration: "30d"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
