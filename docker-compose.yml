# Hybrid stack: inference, the RAG embedding service, and Qdrant run in
# Docker (vLLM + LiteLLM + embedding + qdrant). Everything else runs on the
# host in separate terminals: Postgres, backend, frontend.
#
# LiteLLM reaches:
#   - vLLM via the compose network (http://vllm:8000/v1)
#   - host Postgres via host.docker.internal (litellm database)
#
# The backend (host) reaches embedding via http://127.0.0.1:8002 and Qdrant
# via http://127.0.0.1:6333 — unchanged from when both ran by hand, since
# both containers publish those same ports.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f vllm

services:
  vllm:
    # vLLM nightly — required for Muse Glimmer (model + muse_glimmer parsers, PR 51655).
    # For local Qwen, this is still compatible. Rollback: v0.26.0.
    image: vllm/vllm-openai:nightly
    restart: unless-stopped
    ipc: host
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      # Required when Docker Desktop uses WSL2 backend.
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    # Defaults tuned conservatively for a VRAM-constrained laptop GPU — all
    # env-var driven (VLLM_GPU_MEMORY_UTILIZATION, VLLM_MAX_MODEL_LEN,
    # VLLM_MAX_NUM_SEQS below), not hardcoded to a specific card, so a bigger
    # GPU just means raising these in .env, not editing this file.
    # NOTE: Local defaults stay Qwen (8GB-safe). RunPod overrides via .env to
    # cyankiwi/Muse-Glimmer-30B-AWQ-INT4 (see .env.runpod.example). Glimmer
    # requires nightly + muse_glimmer parsers — added via runpod-start-vllm.sh
    # for RunPod; local compose keeps minimal flags so Qwen still boots. If you
    # manually set VLLM_MODEL to Glimmer locally, add --enable-auto-tool-choice
    # --tool-call-parser muse_glimmer --reasoning-parser muse_glimmer --generation-config auto
    # to the command abaixo.
    command:
      - --model=${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct-AWQ}
      - --served-model-name=${VLLM_SERVED_NAME:-qwen2.5-1.5b}
      - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.70}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-2048}
      - --max-num-seqs=${VLLM_MAX_NUM_SEQS:-4}
      - --enforce-eager
      - --dtype=auto
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "${VLLM_PORT:-8000}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_healthy
    # Reach Postgres installed on the Windows/macOS/Linux host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Host Postgres "litellm" DB (must already exist + accept Docker connections).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:${POSTGRES_PORT:-5432}/litellm
      # Used by litellm/config.yaml → model_list[].litellm_params.api_base
      VLLM_API_BASE: http://vllm:8000/v1
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  embedding:
    build:
      context: ./embedding
    restart: unless-stopped
    environment:
      # Must match backend/.env's EMBEDDING_MODEL (not read from that file —
      # Docker containers don't see the host process's .env, so this repeats
      # it explicitly). Override via the root .env if you ever change models.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      # GPU/CPU fallback threshold — see embedding/app/embedder.py. Shares
      # the GPU with vllm (below), so this is what keeps embeddings on CPU
      # when vllm has already claimed most of a small card's VRAM.
      EMBEDDING_GPU_MIN_FREE_MB: ${EMBEDDING_GPU_MIN_FREE_MB:-1536}
    volumes:
      # Shares vllm's HF cache volume — embedding/Dockerfile sets
      # HF_HOME to this same path, so the model download persists across
      # container recreates instead of re-downloading every restart.
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "${EMBEDDING_PORT:-8002}:8002"
    # Mirrors vllm's GPU access exactly — embedder.py does its own free-VRAM
    # probe at startup and falls back to CPU on this card, but it still needs
    # the device visible to make that decision (see embedding/Dockerfile).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # No curl in this image (see embedding/Dockerfile's apt-get list) —
      # python3 is already present, so this mirrors litellm's urllib-based
      # check above rather than vllm's curl-based one.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      # fastembed loads/downloads the ONNX model on startup; no explicit
      # timing in app/embedder.py, so this follows the "40-60s when unclear"
      # default. Tune down once real cold-start time is observed.
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      # Same on-disk data the standalone qdrant.exe was using — collections
      # carry over unchanged, no re-ingestion needed.
      - ./qdrant/storage:/qdrant/storage
      - ./qdrant/snapshots:/qdrant/snapshots
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    healthcheck:
      # No curl/wget in this image — plain TCP probe via bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  searxng:
    build:
      context: ./searxng
    restart: unless-stopped
    environment:
      # update-ca-certificates (run by the entrypoint) merges our injected
      # Avast CA into the system bundle, but SearXNG's own Python HTTP
      # client (httpx) uses its bundled certifi list by default and ignores
      # that — pointing it at the system bundle explicitly is what actually
      # makes it trust the cert. wget (used for the healthcheck) already
      # worked without this since it reads the system store directly.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      # /etc/searxng is __SEARXNG_CONFIG_PATH (confirmed via the image's own
      # entrypoint.sh) — settings.yml lives here. If this directory is empty
      # on first start, the entrypoint auto-generates settings.yml from its
      # template with a fresh random secret_key; ours has since been edited
      # to enable the JSON output format the backend depends on.
      - ./searxng:/etc/searxng:rw
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    healthcheck:
      # wget is present in this image (no curl) — confirmed by inspection.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  huggingface_cache:
