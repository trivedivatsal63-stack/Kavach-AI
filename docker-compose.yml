# Hybrid stack: inference + the RAG embedding service run in Docker
# (vLLM + LiteLLM + embedding). Everything else runs on the host in separate
# terminals: Postgres, Qdrant, backend, frontend.
#
# LiteLLM reaches:
#   - vLLM via the compose network (http://vllm:8000/v1)
#   - host Postgres via host.docker.internal (litellm database)
#
# The backend (host) reaches embedding via http://127.0.0.1:8002 — same
# EMBEDDING_BASE_URL as when it was run by hand, since embedding now
# publishes that port from the container.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f vllm

services:
  vllm:
    # v0.26.0 — broad CUDA arch support across modern consumer/laptop GPUs.
    image: vllm/vllm-openai:v0.26.0
    restart: unless-stopped
    ipc: host
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      # Required when Docker Desktop uses WSL2 backend.
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    # Defaults tuned conservatively for a VRAM-constrained laptop GPU — all
    # env-var driven (VLLM_GPU_MEMORY_UTILIZATION, VLLM_MAX_MODEL_LEN,
    # VLLM_MAX_NUM_SEQS below), not hardcoded to a specific card, so a bigger
    # GPU just means raising these in .env, not editing this file.
    command:
      - --model=${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct-AWQ}
      - --served-model-name=${VLLM_SERVED_NAME:-qwen2.5-1.5b}
      - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.70}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-2048}
      - --max-num-seqs=${VLLM_MAX_NUM_SEQS:-4}
      - --enforce-eager
      - --dtype=auto
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "${VLLM_PORT:-8000}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_healthy
    # Reach Postgres installed on the Windows/macOS/Linux host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Host Postgres "litellm" DB (must already exist + accept Docker connections).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:${POSTGRES_PORT:-5432}/litellm
      # Used by litellm/config.yaml → model_list[].litellm_params.api_base
      VLLM_API_BASE: http://vllm:8000/v1
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  embedding:
    build:
      context: ./embedding
    restart: unless-stopped
    environment:
      # Must match backend/.env's EMBEDDING_MODEL (not read from that file —
      # Docker containers don't see the host process's .env, so this repeats
      # it explicitly). Override via the root .env if you ever change models.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      # GPU/CPU fallback threshold — see embedding/app/embedder.py. Shares
      # the GPU with vllm (below), so this is what keeps embeddings on CPU
      # when vllm has already claimed most of a small card's VRAM.
      EMBEDDING_GPU_MIN_FREE_MB: ${EMBEDDING_GPU_MIN_FREE_MB:-1536}
    volumes:
      # Shares vllm's HF cache volume — embedding/Dockerfile sets
      # HF_HOME to this same path, so the model download persists across
      # container recreates instead of re-downloading every restart.
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "${EMBEDDING_PORT:-8002}:8002"
    # Mirrors vllm's GPU access exactly — embedder.py does its own free-VRAM
    # probe at startup and falls back to CPU on this card, but it still needs
    # the device visible to make that decision (see embedding/Dockerfile).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # No curl in this image (see embedding/Dockerfile's apt-get list) —
      # python3 is already present, so this mirrors litellm's urllib-based
      # check above rather than vllm's curl-based one.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      # fastembed loads/downloads the ONNX model on startup; no explicit
      # timing in app/embedder.py, so this follows the "40-60s when unclear"
      # default. Tune down once real cold-start time is observed.
      start_period: 60s

volumes:
  huggingface_cache:
