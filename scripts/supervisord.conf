; Kavach-AI RunPod process supervisor.
; Paths assume the repo is cloned to /workspace/kavach-ai (see RUNPOD_DEPLOY.md).
; Child processes inherit the environment exported by runpod-deploy.sh before
; supervisord starts — only transform/interpolation overrides live here.

[supervisord]
; false so runpod-deploy.sh can start it and return; logs still go to logfile.
nodaemon=false
logfile=/workspace/kavach-ai/logs/supervisord.log
pidfile=/workspace/kavach-ai/logs/supervisord.pid
childlogdir=/workspace/kavach-ai/logs

[unix_http_server]
file=/workspace/kavach-ai/logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///workspace/kavach-ai/logs/supervisor.sock

[program:postgres]
; PG_BIN is a symlink created by runpod-setup.sh → /usr/lib/postgresql/<ver>/bin
command=/workspace/bin/pg_bin/postgres -D /var/lib/postgresql/pgdata
user=postgres
autostart=true
autorestart=true
stdout_logfile=/workspace/kavach-ai/logs/postgres.log
stderr_logfile=/workspace/kavach-ai/logs/postgres.err.log
priority=10

[program:trtllm]
; TensorRT-LLM OpenAI server + /tokenize wrapper on :8000 (Gemma 4 26B-A4B MoE).
; First boot downloads the AWQ checkpoint; later restarts reuse the fingerprint.
command=/workspace/kavach-ai/scripts/runpod-start-trtllm.sh
environment=HF_HOME="/workspace/.hf-cache",HUGGING_FACE_HUB_TOKEN="%(ENV_HUGGING_FACE_HUB_TOKEN)s"
autostart=true
autorestart=true
stdout_logfile=/workspace/kavach-ai/logs/trtllm.log
stderr_logfile=/workspace/kavach-ai/logs/trtllm.err.log
priority=20
startsecs=120
startretries=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=40
; vLLM rollback: comment the block above, uncomment [program:vllm] below,
; and point runpod-deploy.sh health checks back at the vllm program name.
; [program:vllm]
; command=/workspace/kavach-ai/scripts/runpod-start-vllm.sh
; environment=HF_HOME="/workspace/.hf-cache",HUGGING_FACE_HUB_TOKEN="%(ENV_HUGGING_FACE_HUB_TOKEN)s"
; autostart=true
; autorestart=true
; stdout_logfile=/workspace/kavach-ai/logs/vllm.log
; stderr_logfile=/workspace/kavach-ai/logs/vllm.err.log
; priority=20
; startsecs=60
; startretries=10

[program:litellm]
command=/workspace/venvs/litellm/bin/litellm --config /workspace/kavach-ai/litellm/config.yaml --port 4000 --host 0.0.0.0
environment=VLLM_API_BASE="http://127.0.0.1:8000/v1",DATABASE_URL="%(ENV_LITELLM_DATABASE_URL)s",LITELLM_MASTER_KEY="%(ENV_LITELLM_MASTER_KEY)s"
autostart=true
autorestart=true
stdout_logfile=/workspace/kavach-ai/logs/litellm.log
stderr_logfile=/workspace/kavach-ai/logs/litellm.err.log
priority=30
startsecs=10

[program:embedding]
command=/workspace/venvs/embedding/bin/uvicorn app.main:app --host 127.0.0.1 --port 8002
directory=/workspace/kavach-ai/embedding
; CUDA libs used to come from the vLLM venv; TRT-LLM's venv is the GPU stack now.
; deploy.sh exports EMBEDDING_LD_LIBRARY_PATH after probing the venv layout.
environment=LD_LIBRARY_PATH="%(ENV_EMBEDDING_LD_LIBRARY_PATH)s"
autostart=true
autorestart=true
stdout_logfile=/workspace/kavach-ai/logs/embedding.log
stderr_logfile=/workspace/kavach-ai/logs/embedding.err.log
priority=40

[program:qdrant]
command=/workspace/qdrant/qdrant
directory=/workspace/qdrant
environment=QDRANT__STORAGE__STORAGE_PATH="/workspace/qdrant/storage"
autostart=true
autorestart=true
stdout_logfile=/workspace/kavach-ai/logs/qdrant.log
stderr_logfile=/workspace/kavach-ai/logs/qdrant.err.log
priority=40

[program:searxng]
; Port 8888 is taken by RunPod's own Jupyter notebook service on this
; template (confirmed live) -- 8889 avoids that collision entirely.
; python -m searx.webapp does not actually start a server (no __main__
; entrypoint for that) -- the Flask CLI is the real, documented way to run
; this standalone (see searx/webapp.py's own module docstring).
command=/workspace/venvs/searxng/bin/python -m flask --app searx.webapp run --host 0.0.0.0 --port 8889
directory=/workspace/searxng-src
environment=SEARXNG_SETTINGS_PATH="/workspace/kavach-ai/searxng/settings.yml"
autostart=true
autorestart=true
stdout_logfile=/workspace/kavach-ai/logs/searxng.log
stderr_logfile=/workspace/kavach-ai/logs/searxng.err.log
priority=40

[program:backend]
; --accept-data-loss: required here -- db push otherwise refuses on any
; migration that could lose data (e.g. adding a unique constraint), even on
; a schema this app fully owns with no untrusted external state. Confirmed
; live: this was silently blocking every boot, not just the contentTsv fix.
command=/bin/sh -c "npx prisma db push --skip-generate --accept-data-loss && exec node dist/index.js"
directory=/workspace/kavach-ai/backend
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",LITELLM_BASE_URL="http://127.0.0.1:4000",VLLM_BASE_URL="http://127.0.0.1:8000",QDRANT_URL="http://127.0.0.1:6333",EMBEDDING_BASE_URL="http://127.0.0.1:8002",SEARXNG_URL="http://127.0.0.1:8889",PORT="4001"
autostart=true
autorestart=true
stdout_logfile=/workspace/kavach-ai/logs/backend.log
stderr_logfile=/workspace/kavach-ai/logs/backend.err.log
priority=50
startsecs=5

[program:frontend]
command=/workspace/kavach-ai/frontend/node_modules/.bin/vite preview --host 0.0.0.0 --port 5173
directory=/workspace/kavach-ai/frontend
autostart=true
autorestart=true
stdout_logfile=/workspace/kavach-ai/logs/frontend.log
stderr_logfile=/workspace/kavach-ai/logs/frontend.err.log
priority=60

[program:autopull]
; Polling fallback when GitHub Actions can't reach pod (IP rotated, offline).
; redeploy.sh is diff-aware, so this is cheap when nothing changed.
command=/bin/bash -c 'while true; do /workspace/kavach-ai/scripts/autopull.sh >> /workspace/kavach-ai/logs/autopull.log 2>&1; sleep 120; done'
autostart=true
autorestart=true
stdout_logfile=/workspace/kavach-ai/logs/autopull.log
stderr_logfile=/workspace/kavach-ai/logs/autopull.err.log
priority=70
